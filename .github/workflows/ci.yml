name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  static-and-unit:
    name: Static checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked development dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        run: make lint

      - name: Type-check
        run: make typecheck

      - name: Run unit tests
        run: make test-unit

  integration-and-quality:
    name: Integration and quality tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked development dependencies
        run: uv sync --locked --extra dev

      - name: Run service-backed integration suite
        run: make test-integration

      - name: Run bounded quality repetition suite
        run: make quality-load

      - name: Show service logs after a failure
        if: failure()
        run: docker compose logs --no-color

      - name: Remove CI services and volumes
        if: always()
        run: make reset CONFIRM=reset

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate Compose profiles
        run: |
          docker compose config --quiet
          docker compose --profile app config --quiet

      - name: Build production image
        run: docker build --tag events-concierge:ci .

      - name: Smoke-test installed package and non-root user
        run: |
          docker run --rm --entrypoint python events-concierge:ci -c "import events_concierge"
          test "$(docker run --rm --entrypoint id events-concierge:ci -u)" != "0"
