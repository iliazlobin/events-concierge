# Layer after values-development.yaml; deploy only through the private platform access path.
# The runtime remains the private development profile pending independent production gates.
applicationConfig:
  EC_RELEASE_PROFILE: discovery
  EC_PUBLIC_BASE_URL: http://127.0.0.1:14001
  EC_MEDIA_BACKEND: gcs
  EC_GCS_MEDIA_BUCKET: iz27-platform-dev-ec-media
  EC_GCS_MEDIA_PREFIX: events-concierge/media/v1
  EC_GCP_PROJECT: iz27-platform-dev
  EC_GCS_CLAIM_CHECK_BUCKET: iz27-platform-dev-ec-payloads
secretManager:
  projectId: iz27-platform-dev
# Do not resume deferred transactional effects from the restored legacy database.
workloads:
  temporal-transactional:
    enabled: false
  request-starter:
    enabled: false
  notifier:
    enabled: false
  change-delivery:
    enabled: false
