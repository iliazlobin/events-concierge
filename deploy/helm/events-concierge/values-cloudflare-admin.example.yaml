# Layer over reviewed authenticated private + tunnel values and the isolated operator identity.
# Empty AUD/subject map intentionally prevent activation until verified in Cloudflare.
operator:
  enabled: true
  authProvider: cloudflare_access
  hostname: admin-events.iliazlobin.com
  tlsSecretName: ""
  iapAudience: ""
  iapClientId: ""
  iapClientSecretName: ""
  frontendIngressCidrs: []
  cloudflareAccess:
    teamDomain: https://wild-butterfly-a721.cloudflareaccess.com
    audience: ""
    # Confirm this team's current certificate endpoint addresses remain inside this range.
    jwksCidrs: [104.16.0.0/13]
  subjectRoles: {}
workloads:
  operator-frontend:
    enabled: true
  operator-api:
    enabled: true
publicTunnel:
  enabled: true
