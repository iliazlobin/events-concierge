{{- if and .Values.operator.enabled (eq .Values.operator.authProvider "iap") (ne .Values.global.deploymentProfile "private") (eq .Values.global.releasePhase "application") }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "events-concierge.fullname" . }}-operator
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.operator.hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: {{ .Values.operator.tlsSecretName }}
      allowedRoutes:
        namespaces: {from: Same}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "events-concierge.fullname" . }}-operator
spec:
  parentRefs:
    - name: {{ include "events-concierge.fullname" . }}-operator
      sectionName: https
  hostnames: [{{ .Values.operator.hostname | quote }}]
  rules:
    - backendRefs:
        - name: {{ include "events-concierge.fullname" . }}-operator-frontend
          port: 80
---
# GKE Gateway IAP configuration; the referenced OAuth Secret is provisioned separately.
# https://cloud.google.com/kubernetes-engine/docs/how-to/configure-gateway-resources#configure_iap
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: {{ include "events-concierge.fullname" . }}-operator-iap
spec:
  default:
    iap:
      enabled: true
      clientID: {{ .Values.operator.iapClientId | quote }}
      oauth2ClientSecret:
        name: {{ .Values.operator.iapClientSecretName }}
  targetRef:
    group: ""
    kind: Service
    name: {{ include "events-concierge.fullname" . }}-operator-frontend
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: {{ include "events-concierge.fullname" . }}-operator-frontend
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        portSpecification: USE_FIXED_PORT
        port: 3000
        requestPath: /healthz
  targetRef:
    group: ""
    kind: Service
    name: {{ include "events-concierge.fullname" . }}-operator-frontend
{{- end }}
