{{- if .Values.publicTunnel.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "events-concierge.fullname" . }}-public-tunnel
data:
  Caddyfile: |
    {{- tpl (.Files.Get "files/public-consumer.Caddyfile") . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "events-concierge.fullname" . }}-public-tunnel
spec:
  replicas: {{ .Values.publicTunnel.replicas }}
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      {{- include "events-concierge.selectorLabels" (dict "root" . "component" "public-tunnel") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "events-concierge.labels" (dict "root" . "component" "public-tunnel") | nindent 8 }}
      annotations:
        checksum/public-proxy: {{ tpl (.Files.Get "files/public-consumer.Caddyfile") . | sha256sum }}
    spec:
      # No Workload Identity, Kubernetes API token or application secrets.
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "events-concierge.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "events-concierge.selectorLabels" (dict "root" . "component" "public-tunnel") | nindent 14 }}
      containers:
        - name: cloudflared
          image: {{ include "events-concierge.image" .Values.publicTunnel.cloudflaredImage | quote }}
          imagePullPolicy: {{ .Values.publicTunnel.cloudflaredImage.pullPolicy }}
          args: [tunnel, --no-autoupdate, --edge-ip-version, "4", --protocol, auto, --loglevel, warn, --metrics, "0.0.0.0:2000", run, --token-file, /var/run/secrets/cloudflare/token]
          securityContext:
            {{- include "events-concierge.appSecurityContext" . | nindent 12 }}
          ports: [{name: tunnel-metrics, containerPort: 2000}]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          startupProbe:
            httpGet: {path: /ready, port: tunnel-metrics}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /ready, port: tunnel-metrics}
            periodSeconds: 10
          # Connection outages lower readiness; cloudflared reconnects without a restart loop.
          volumeMounts:
            - {name: token, mountPath: /var/run/secrets/cloudflare, readOnly: true}
            - {name: tunnel-tmp, mountPath: /tmp}
        - name: consumer-filter
          image: {{ include "events-concierge.image" .Values.publicTunnel.proxyImage | quote }}
          imagePullPolicy: {{ .Values.publicTunnel.proxyImage.pullPolicy }}
          command: [caddy, run, --config, /etc/events-concierge/Caddyfile, --adapter, caddyfile]
          env:
            - {name: XDG_CONFIG_HOME, value: /tmp/config}
            - {name: XDG_DATA_HOME, value: /tmp/data}
          securityContext:
            # The official Caddy executable has this file capability; its bounded set
            # must include it even though this configuration listens on high ports.
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          readinessProbe:
            exec:
              command: [wget, -q, -T, "6", -O, /dev/null, "http://127.0.0.1:8081/readyz"]
            periodSeconds: 10
            timeoutSeconds: 7
          livenessProbe:
            exec:
              command: [wget, -q, -T, "2", -O, /dev/null, "http://127.0.0.1:8081/healthz"]
            periodSeconds: 30
            timeoutSeconds: 3
          volumeMounts:
            - {name: proxy-config, mountPath: /etc/events-concierge, readOnly: true}
            - {name: proxy-tmp, mountPath: /tmp}
      volumes:
        - name: token
          secret:
            secretName: {{ .Values.publicTunnel.tokenSecretName | quote }}
            defaultMode: 0440
            items: [{key: token, path: token}]
        - name: proxy-config
          configMap:
            name: {{ include "events-concierge.fullname" . }}-public-tunnel
        - name: tunnel-tmp
          emptyDir: {sizeLimit: 32Mi}
        - name: proxy-tmp
          emptyDir: {sizeLimit: 32Mi}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "events-concierge.fullname" . }}-public-tunnel
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "events-concierge.selectorLabels" (dict "root" . "component" "public-tunnel") | nindent 6 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "events-concierge.fullname" . }}-public-tunnel
spec:
  podSelector:
    matchLabels:
      {{- include "events-concierge.selectorLabels" (dict "root" . "component" "public-tunnel") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: gmp-system}
      ports: [{port: 2000, protocol: TCP}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchExpressions:
              - key: k8s-app
                operator: In
                values: [kube-dns, node-local-dns]
      ports: [{port: 53, protocol: TCP}, {port: 53, protocol: UDP}]
    - to:
        - podSelector:
            matchLabels:
              {{- include "events-concierge.selectorLabels" (dict "root" . "component" "frontend") | nindent 14 }}
      ports: [{port: 3000, protocol: TCP}]
    # IPv4 tunnel endpoint ranges; no general Internet, metadata, API or datastore access.
    - to:
        - ipBlock: {cidr: 198.41.192.0/24}
        - ipBlock: {cidr: 198.41.200.0/24}
      ports: [{port: 7844, protocol: TCP}, {port: 7844, protocol: UDP}]
{{- if .Values.podMonitoring.enabled }}
---
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: {{ include "events-concierge.fullname" . }}-public-tunnel
spec:
  selector:
    matchLabels:
      {{- include "events-concierge.selectorLabels" (dict "root" . "component" "public-tunnel") | nindent 6 }}
  endpoints:
    - {port: tunnel-metrics, interval: {{ .Values.podMonitoring.interval }}}
{{- end }}
{{- end }}
