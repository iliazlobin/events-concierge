{{- if and .Values.networkPolicy.enabled (eq (default "managed" .Values.global.deploymentProfile) "managed") }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "events-concierge.fullname" . }}-default-deny
  labels:
    {{- include "events-concierge.labels" (dict "root" . "component" "network-policy") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "events-concierge.fullname" . }}-dns
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: events-concierge
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: NotIn
        values: [public-tunnel]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "events-concierge.fullname" . }}-application-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: events-concierge
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: NotIn
        values: [public-tunnel]
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {port: 443, protocol: TCP}
        - {port: 7233, protocol: TCP}
    - to:
        - ipBlock: {cidr: 169.254.169.254/32}
      ports:
        - {port: 80, protocol: TCP}
    {{- range .Values.networkPolicy.privateCidrs }}
    - to:
        - ipBlock: {cidr: {{ . | quote }}}
      ports:
        - {port: 3307, protocol: TCP}
        - {port: 5432, protocol: TCP}
        - {port: 6378, protocol: TCP}
        - {port: 6379, protocol: TCP}
        - {port: 6380, protocol: TCP}
        - {port: 8000, protocol: TCP}
    {{- end }}
{{- if or (eq .Values.global.releasePhase "all") (eq .Values.global.releasePhase "application") }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "events-concierge.fullname" . }}-frontend-ingress
spec:
  podSelector:
    matchLabels:
      {{- include "events-concierge.selectorLabels" (dict "root" . "component" "frontend") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- if .Values.publicTunnel.enabled }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "events-concierge.selectorLabels" (dict "root" . "component" "public-tunnel") | nindent 14 }}
      ports:
        - {port: 3000, protocol: TCP}
    {{- else }}
    {{- range .Values.networkPolicy.frontendIngressCidrs }}
    - from:
        - ipBlock: {cidr: {{ . | quote }}}
      ports:
        - {port: 3000, protocol: TCP}
    {{- end }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "events-concierge.fullname" . }}-api-ingress
spec:
  podSelector:
    matchLabels:
      {{- include "events-concierge.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "events-concierge.selectorLabels" (dict "root" . "component" "frontend") | nindent 14 }}
      ports:
        - {port: 8000, protocol: TCP}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gmp-system
      ports:
        - {port: 8000, protocol: TCP}
{{- end }}
{{- end }}

{{- if and .Values.operator.enabled .Values.networkPolicy.enabled (eq .Values.global.releasePhase "application") }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "events-concierge.fullname" . }}-operator-frontend-ingress
spec:
  podSelector:
    matchLabels:
      {{- include "events-concierge.selectorLabels" (dict "root" . "component" "operator-frontend") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- range .Values.networkPolicy.frontendIngressCidrs }}
    - from:
        - ipBlock: {cidr: {{ . | quote }}}
      ports: [{port: 3000, protocol: TCP}]
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "events-concierge.fullname" . }}-operator-api-ingress
spec:
  podSelector:
    matchLabels:
      {{- include "events-concierge.selectorLabels" (dict "root" . "component" "operator-api") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "events-concierge.selectorLabels" (dict "root" . "component" "operator-frontend") | nindent 14 }}
      ports: [{port: 8000, protocol: TCP}]
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gmp-system
      ports: [{port: 8000, protocol: TCP}]
{{- end }}
