{{- if and .Values.developmentCatalog.cadenceEnabled (eq .Values.global.releasePhase "application") }}
# This process only queues due reviewed sources. The separate executor performs collection.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "events-concierge.fullname" . }}-ingestion-cadence
  labels:
    {{- include "events-concierge.labels" (dict "root" . "component" "ingestion-cadence") | nindent 4 }}
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 240
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 90
      template:
        metadata:
          labels:
            app.kubernetes.io/name: events-concierge-ingestion-cadence
            app.kubernetes.io/part-of: events-concierge
          annotations:
            checksum/operator-secret-versions: {{ .Values.developmentAdmin.operatorSecrets | toJson | sha256sum }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ (index .Values.serviceAccounts "development-admin").name }}
          automountServiceAccountToken: true
          enableServiceLinks: false
          securityContext:
            {{- include "events-concierge.podSecurityContext" . | nindent 12 }}
          containers:
            - name: cadence
              image: {{ include "events-concierge.image" .Values.global.appImage | quote }}
              command: [python, -m, events_concierge.workers.ingestion_cadence, --once]
              envFrom:
                - configMapRef:
                    name: {{ include "events-concierge.fullname" . }}-runtime
              env:
                - {name: EC_API_BIND_ADDRESS, value: "127.0.0.1"}
                - {name: EC_ADMIN_INGESTION_ENABLED, value: "true"}
                - {name: EC_CATALOG_INGESTION_SCHEDULER_ENABLED, value: "true"}
                - {name: EC_OPERATOR_DATABASE_URL_FILE, value: /var/run/secrets/events-concierge-operator/EC_OPERATOR_DATABASE_URL}
              securityContext:
                {{- include "events-concierge.appSecurityContext" . | nindent 16 }}
              resources:
                requests: {cpu: 25m, memory: 128Mi}
                limits: {cpu: 500m, memory: 384Mi}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
                - {name: runtime-secrets, mountPath: /var/run/secrets/events-concierge, readOnly: true}
                - {name: operator-secrets, mountPath: /var/run/secrets/events-concierge-operator, readOnly: true}
          volumes:
            - name: tmp
              emptyDir: {sizeLimit: 64Mi}
            - name: runtime-secrets
              csi:
                driver: secrets-store-gke.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: {{ include "events-concierge.runtimeSecretProviderClass" . | quote }}
            - name: operator-secrets
              csi:
                driver: secrets-store-gke.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: {{ printf "%s-development-operator" (include "events-concierge.fullname" .) | quote }}
{{- end }}
