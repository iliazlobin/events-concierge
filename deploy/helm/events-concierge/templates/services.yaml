{{- if or (eq .Values.global.releasePhase "all") (eq .Values.global.releasePhase "application") }}
{{- $root := . -}}
{{- range $name, $service := .Values.services }}
{{- if or (not $service.operatorOnly) $root.Values.operator.enabled (and $root.Values.publicEdge.enabled $root.Values.publicEdge.bootstrap (eq $name "operator-frontend")) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "events-concierge.fullname" $root }}-{{ $name }}
  labels:
    {{- include "events-concierge.labels" (dict "root" $root "component" $name) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- $component := $name }}
    {{- if and $root.Values.publicEdge.enabled (eq $name "operator-frontend") }}
    {{- $component = ternary "operator-bootstrap-unassigned" "frontend" $root.Values.publicEdge.bootstrap }}
    {{- end }}
    {{- include "events-concierge.selectorLabels" (dict "root" $root "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: {{ $service.port }}
      {{- if and $root.Values.publicEdge.enabled (has $name (list "frontend" "operator-frontend")) }}
      targetPort: {{ ternary 8080 8082 (eq $name "frontend") }}
      {{- else }}
      targetPort: {{ $service.targetPort }}
      {{- end }}
      protocol: TCP
{{- end }}
{{- end }}
{{- end }}
