{{- if .Values.publicEdge.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "events-concierge.fullname" . }}-public-edge
data:
  Caddyfile: |
    {{- tpl (.Files.Get "files/public-consumer.Caddyfile") . | nindent 4 }}
---
apiVersion: networking.gke.io/v1
kind: GCPGatewayPolicy
metadata:
  name: {{ include "events-concierge.fullname" . }}-public-tls
spec:
  default:
    sslPolicy: {{ .Values.publicEdge.sslPolicy | quote }}
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ include "events-concierge.fullname" . }}-public
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "events-concierge.fullname" . }}-public
  annotations:
    networking.gke.io/certmap: {{ .Values.publicEdge.certificateMap | quote }}
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
    - type: NamedAddress
      value: {{ .Values.publicEdge.staticIpName | quote }}
  listeners:
    {{- range $site, $host := dict "consumer" .Values.publicEdge.hostname "operator" .Values.operator.hostname }}
    - name: {{ $site }}-https
      hostname: {{ $host | quote }}
      protocol: HTTPS
      port: 443
      allowedRoutes: {namespaces: {from: Same}}
    - name: {{ $site }}-http
      hostname: {{ $host | quote }}
      protocol: HTTP
      port: 80
      allowedRoutes: {namespaces: {from: Same}}
    {{- end }}
{{- range $site, $host := dict "consumer" .Values.publicEdge.hostname "operator" .Values.operator.hostname }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "events-concierge.fullname" $ }}-{{ $site }}-https-redirect
spec:
  parentRefs:
    - name: {{ include "events-concierge.fullname" $ }}-public
      sectionName: {{ $site }}-http
  hostnames: [{{ $host | quote }}]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, statusCode: 301}
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "events-concierge.fullname" . }}-consumer
spec:
  parentRefs:
    - name: {{ include "events-concierge.fullname" . }}-public
      sectionName: consumer-https
  hostnames: [{{ .Values.publicEdge.hostname | quote }}]
  rules:
    # The same-Pod Caddy filter enforces exact Host/path and strips operator headers.
    - backendRefs:
        - name: {{ include "events-concierge.fullname" . }}-frontend
          port: {{ .Values.services.frontend.port }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "events-concierge.fullname" . }}-operator
spec:
  parentRefs:
    - name: {{ include "events-concierge.fullname" . }}-public
      sectionName: operator-https
  hostnames: [{{ .Values.operator.hostname | quote }}]
  rules:
    - matches:
        - path: {type: Exact, value: /}
        - path: {type: Exact, value: /admin}
        - path: {type: PathPrefix, value: /admin/}
        - path: {type: PathPrefix, value: /_next/}
        - path: {type: Exact, value: /favicon.ico}
      backendRefs:
        - name: {{ include "events-concierge.fullname" . }}-operator-frontend
          port: {{ index .Values.services "operator-frontend" "port" }}
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: {{ include "events-concierge.fullname" . }}-operator-iap
spec:
  default:
    iap:
      enabled: true
      clientID: {{ .Values.operator.iapClientId | quote }}
      oauth2ClientSecret: {name: {{ .Values.operator.iapClientSecretName | quote }}}
  targetRef:
    group: ""
    kind: Service
    name: {{ include "events-concierge.fullname" . }}-operator-frontend
{{- range $name, $health := dict "frontend" (dict "port" 8081 "path" "/readyz") "operator-frontend" (dict "port" 3000 "path" "/healthz") }}
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: {{ include "events-concierge.fullname" $ }}-{{ $name }}
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        portSpecification: USE_FIXED_PORT
        port: {{ $health.port }}
        requestPath: {{ $health.path }}
  targetRef:
    group: ""
    kind: Service
    name: {{ include "events-concierge.fullname" $ }}-{{ $name }}
{{- end }}
{{- end }}
