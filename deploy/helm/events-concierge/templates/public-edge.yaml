{{- if .Values.publicEdge.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "events-concierge.fullname" . }}-public-edge
data:
  Caddyfile: |
    {{- tpl (.Files.Get "files/public-consumer.Caddyfile") . | nindent 4 }}
---
apiVersion: networking.gke.io/v1
kind: GCPGatewayPolicy
metadata:
  name: {{ include "events-concierge.fullname" . }}-public-tls
spec:
  default:
    sslPolicy: {{ .Values.publicEdge.sslPolicy | quote }}
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ include "events-concierge.fullname" . }}-public
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "events-concierge.fullname" . }}-public
  annotations:
    networking.gke.io/certmap: {{ .Values.publicEdge.certificateMap | quote }}
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
    - type: NamedAddress
      value: {{ .Values.publicEdge.staticIpName | quote }}
  listeners:
    - name: public-https
      hostname: {{ .Values.publicEdge.hostname | quote }}
      protocol: HTTPS
      port: 443
      allowedRoutes: {namespaces: {from: Same}}
    - name: public-http
      hostname: {{ .Values.publicEdge.hostname | quote }}
      protocol: HTTP
      port: 80
      allowedRoutes: {namespaces: {from: Same}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "events-concierge.fullname" . }}-https-redirect
spec:
  parentRefs:
    - name: {{ include "events-concierge.fullname" . }}-public
      sectionName: public-http
  hostnames: [{{ .Values.publicEdge.hostname | quote }}]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, statusCode: 301}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "events-concierge.fullname" . }}-consumer
spec:
  parentRefs:
    - name: {{ include "events-concierge.fullname" . }}-public
      sectionName: public-https
  hostnames: [{{ .Values.publicEdge.hostname | quote }}]
  rules:
    # The same-Pod Caddy filter enforces exact Host/path and strips operator headers.
    - backendRefs:
        - name: {{ include "events-concierge.fullname" . }}-frontend
          port: {{ .Values.services.frontend.port }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "events-concierge.fullname" . }}-operator
spec:
  parentRefs:
    - name: {{ include "events-concierge.fullname" . }}-public
      sectionName: public-https
  hostnames: [{{ .Values.operator.hostname | quote }}]
  rules:
    - matches:
        - path: {type: Exact, value: /admin}
        - path: {type: PathPrefix, value: /admin}
      backendRefs:
        - name: {{ include "events-concierge.fullname" . }}-operator-frontend
          port: {{ index .Values.services "operator-frontend" "port" }}
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: {{ include "events-concierge.fullname" . }}-operator-iap
spec:
  default:
    iap:
      enabled: true
      clientID: {{ .Values.operator.iapClientId | quote }}
      oauth2ClientSecret: {name: {{ .Values.operator.iapClientSecretName | quote }}}
  targetRef:
    group: ""
    kind: Service
    name: {{ include "events-concierge.fullname" . }}-operator-frontend
{{- range $name := list "frontend" "operator-frontend" }}
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: {{ include "events-concierge.fullname" $ }}-{{ $name }}
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        portSpecification: USE_FIXED_PORT
        port: 8081
        requestPath: /readyz
  targetRef:
    group: ""
    kind: Service
    name: {{ include "events-concierge.fullname" $ }}-{{ $name }}
{{- end }}
{{- end }}
