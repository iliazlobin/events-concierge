{{- $root := . -}}
{{- $devCatalog := and (eq (default "managed" .Values.global.deploymentProfile) "development") .Values.developmentCatalog.enabled -}}
{{- $private := eq .Values.global.deploymentProfile "private" -}}
{{- if or (eq .Values.global.releasePhase "all") (eq .Values.global.releasePhase "application") }}
{{- range $name, $workload := .Values.workloads }}
{{- if and $workload.enabled (or (not $workload.operatorProfile) $root.Values.operator.enabled (and (or $devCatalog $private) (eq $name "ingestion-executor"))) }}
{{- $profile := default "runtime" $workload.operatorProfile }}
{{- if and (eq $name "temporal-catalog") $root.Values.operator.enabled }}{{- $profile = "executor" }}{{- end }}
{{- if and $devCatalog (has $name (list "ingestion-executor" "temporal-catalog")) }}{{- $profile = "development-executor" }}{{- end }}
{{- if $private }}{{- $profile = printf "private-%s" $name }}{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "events-concierge.fullname" $root }}-{{ $name }}
  labels:
    {{- include "events-concierge.labels" (dict "root" $root "component" $name) | nindent 4 }}
spec:
  replicas: {{ $workload.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ ternary 0 1 (or $private (eq (default "managed" $root.Values.global.deploymentProfile) "development")) }}
      maxUnavailable: {{ ternary 1 0 (or $private (eq (default "managed" $root.Values.global.deploymentProfile) "development")) }}
  selector:
    matchLabels:
      {{- include "events-concierge.selectorLabels" (dict "root" $root "component" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "events-concierge.selectorLabels" (dict "root" $root "component" $name) | nindent 8 }}
        app.kubernetes.io/part-of: events-concierge
        {{- if and $private (eq $name "frontend") }}
        ec-network-role: consumer-frontend
        {{- end }}
      annotations:
        checksum/runtime-config: {{ include (print $root.Template.BasePath "/configmap.yaml") $root | sha256sum }}
        {{- if and $root.Values.publicEdge.enabled (eq $name "frontend") }}
        checksum/public-edge: {{ tpl ($root.Files.Get "files/public-consumer.Caddyfile") $root | sha256sum }}
        {{- end }}
        {{- if $private }}
        checksum/private-runtime: {{ $root.Values.privateRuntime | toJson | sha256sum }}
        {{- end }}
        {{- if eq $profile "development-executor" }}
        checksum/development-executor-config: {{ include (print $root.Template.BasePath "/development-operator-config.yaml") $root | sha256sum }}
        {{- end }}
        {{- if $workload.runtimeSecrets }}
        checksum/runtime-secret-versions: {{ $root.Values.developmentCatalog | toJson | sha256sum }}-{{ $root.Values.operator | toJson | sha256sum }}-{{ $root.Values.secretManager.runtimeSecrets | toJson | sha256sum }}
        {{- end }}
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
    spec:
      serviceAccountName: {{ (index $root.Values.serviceAccounts (ternary "ingestion-executor" $workload.serviceAccount (eq $profile "executor"))).name }}
      automountServiceAccountToken: {{ $workload.needsIdentity }}
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- include "events-concierge.podSecurityContext" $root | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "events-concierge.selectorLabels" (dict "root" $root "component" $name) | nindent 14 }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "events-concierge.selectorLabels" (dict "root" $root "component" $name) | nindent 14 }}
      {{- if and $workload.database $root.Values.cloudSqlProxy.enabled }}
      initContainers:
        - name: cloud-sql-proxy
          restartPolicy: Always
          image: {{ include "events-concierge.image" $root.Values.cloudSqlProxy.image | quote }}
          imagePullPolicy: {{ $root.Values.cloudSqlProxy.image.pullPolicy }}
          args:
            - --structured-logs
            - --port=5432
            - --address=0.0.0.0
            {{- if $root.Values.cloudSqlProxy.privateIp }}
            - --private-ip
            {{- end }}
            - {{ $root.Values.cloudSqlProxy.instanceConnectionName | quote }}
          ports:
            - name: cloud-sql
              containerPort: 5432
          securityContext:
            {{- include "events-concierge.appSecurityContext" $root | nindent 12 }}
          resources:
            {{- toYaml $root.Values.cloudSqlProxy.resources | nindent 12 }}
          startupProbe:
            tcpSocket: {port: cloud-sql}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            tcpSocket: {port: cloud-sql}
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket: {port: cloud-sql}
            periodSeconds: 10
            timeoutSeconds: 3
      {{- end }}
      containers:
        - name: {{ $name }}
          {{- if or (eq $name "frontend") (eq $name "operator-frontend") }}
          image: {{ include "events-concierge.image" $root.Values.global.frontendImage | quote }}
          imagePullPolicy: {{ $root.Values.global.frontendImage.pullPolicy }}
          env:
            - name: EC_API_ORIGIN
              value: {{ ternary (printf "http://%s-operator-api:8000" (include "events-concierge.fullname" $root)) $root.Values.frontend.apiOrigin (eq $name "operator-frontend") | quote }}
            - name: EC_OPERATOR_API_ENABLED
              value: {{ ternary "true" "false" (eq $name "operator-frontend") | quote }}
            {{- if eq $name "operator-frontend" }}
            - name: EC_OPERATOR_AUTH_PROVIDER
              value: {{ $root.Values.operator.authProvider | quote }}
            - name: EC_OPERATOR_API_ORIGIN
              value: {{ printf "http://%s-operator-api:8000" (include "events-concierge.fullname" $root) | quote }}
            - name: EC_OPERATOR_PUBLIC_ORIGIN
              value: {{ printf "https://%s" $root.Values.operator.hostname | quote }}
            {{- end }}
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
          {{- else }}
          image: {{ include "events-concierge.image" $root.Values.global.appImage | quote }}
          imagePullPolicy: {{ $root.Values.global.appImage.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "events-concierge.fullname" $root }}-{{ $profile }}
          {{- if or $workload.env $private }}
          env:
            {{- if $private }}
            - name: PGSSLROOTCERT
              value: /var/run/events-concierge-tls/postgres/ca.crt
            {{- end }}
            {{- range $key, $value := $workload.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          {{- end }}
          {{- with $workload.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $workload.port }}
          ports:
            - name: http
              containerPort: {{ . }}
              protocol: TCP
          {{- end }}
          securityContext:
            {{- include "events-concierge.appSecurityContext" $root | nindent 12 }}
          resources:
            {{- toYaml $workload.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if and $workload.runtimeSecrets $root.Values.secretManager.enabled }}
            - name: runtime-secrets
              mountPath: /var/run/secrets/events-concierge
              readOnly: true
            {{- end }}
            {{- if and $private $workload.runtimeSecrets }}
            {{- include "events-concierge.privateTLSMounts" (dict "root" $root "process" $name) | nindent 12 }}
            {{- end }}
          {{- if eq $workload.probeType "api" }}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          {{- else if eq $workload.probeType "frontend" }}
          startupProbe:
            tcpSocket: {port: http}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          {{- else }}
          livenessProbe:
            exec:
              command: [python, -c, "import os; os.kill(1, 0)"]
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command: [python, -c, "import os; os.kill(1, 0)"]
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          {{- end }}
        {{- if and $root.Values.publicEdge.enabled (eq $name "frontend") }}
        # Keep the public allowlist beside Next.js without adding a backup Deployment.
        - name: public-edge
          image: {{ include "events-concierge.image" $root.Values.publicEdge.proxyImage | quote }}
          imagePullPolicy: {{ $root.Values.publicEdge.proxyImage.pullPolicy }}
          # Ordinary cp removes the image binary's low-port file capability.
          # All capabilities remain dropped; this proxy binds only high ports.
          command: [/bin/sh, -ec]
          args:
            - cp /usr/bin/caddy /tmp/caddy; exec /tmp/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
          env:
            - {name: XDG_CONFIG_HOME, value: /tmp/config}
            - {name: XDG_DATA_HOME, value: /tmp/data}
          ports:
            - {name: public-http, containerPort: 8080, protocol: TCP}
            - {name: edge-health, containerPort: 8081, protocol: TCP}
          securityContext:
            {{- include "events-concierge.appSecurityContext" $root | nindent 12 }}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          volumeMounts:
            - {name: public-edge-config, mountPath: /etc/caddy, readOnly: true}
            - {name: edge-tmp, mountPath: /tmp}
          startupProbe:
            httpGet: {path: /healthz, port: edge-health}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /readyz, port: edge-health}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: edge-health}
            periodSeconds: 20
            timeoutSeconds: 3
        {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if and $root.Values.publicEdge.enabled (eq $name "frontend") }}
        - name: edge-tmp
          emptyDir: {sizeLimit: 128Mi}
        - name: public-edge-config
          configMap:
            name: {{ include "events-concierge.fullname" $root }}-public-edge
            defaultMode: 0444
        {{- end }}
        {{- if and $workload.runtimeSecrets $root.Values.secretManager.enabled }}
        - name: runtime-secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ printf "%s-%s" (include "events-concierge.fullname" $root) $profile | quote }}
        {{- end }}
        {{- if and $private $workload.runtimeSecrets }}
        {{- include "events-concierge.privateTLSVolumes" (dict "root" $root "process" $name) | nindent 8 }}
        {{- end }}
{{- end }}
{{- end }}
{{- end }}
