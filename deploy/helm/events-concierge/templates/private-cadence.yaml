{{- if and (eq .Values.global.deploymentProfile "private") .Values.privateRuntime.cadenceEnabled (eq .Values.global.releasePhase "application") }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "events-concierge.fullname" . }}-ingestion-cadence
  labels:
    {{- include "events-concierge.labels" (dict "root" . "component" "ingestion-cadence") | nindent 4 }}
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 240
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 90
      template:
        metadata:
          labels:
            app.kubernetes.io/name: events-concierge-ingestion-cadence
            app.kubernetes.io/part-of: events-concierge
          annotations:
            checksum/private-runtime: {{ .Values.privateRuntime | toJson | sha256sum }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ (index .Values.serviceAccounts "development-admin").name }}
          automountServiceAccountToken: true
          enableServiceLinks: false
          securityContext:
            {{- include "events-concierge.podSecurityContext" . | nindent 12 }}
          containers:
            - name: cadence
              image: {{ include "events-concierge.image" .Values.global.appImage | quote }}
              command: [python, -m, events_concierge.workers.ingestion_cadence, --once]
              envFrom:
                - configMapRef:
                    name: {{ include "events-concierge.fullname" . }}-private-controller
              env:
                - {name: PGSSLROOTCERT, value: /var/run/events-concierge-tls/postgres/ca.crt}
              securityContext:
                {{- include "events-concierge.appSecurityContext" . | nindent 16 }}
              resources:
                requests: {cpu: 25m, memory: 128Mi}
                limits: {cpu: 500m, memory: 384Mi}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
                - {name: runtime-secrets, mountPath: /var/run/secrets/events-concierge, readOnly: true}
                {{- include "events-concierge.privateTLSMounts" (dict "root" . "process" "controller") | nindent 16 }}
          volumes:
            - name: tmp
              emptyDir: {sizeLimit: 64Mi}
            - name: runtime-secrets
              csi:
                driver: secrets-store-gke.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: {{ printf "%s-private-controller" (include "events-concierge.fullname" .) | quote }}
            {{- include "events-concierge.privateTLSVolumes" (dict "root" . "process" "controller") | nindent 12 }}
{{- end }}
