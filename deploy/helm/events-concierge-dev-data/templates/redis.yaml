apiVersion: v1
kind: Service
metadata:
  name: ec-dev-redis
spec:
  type: ClusterIP
  selector: {ec-store: redis}
  ports: [{name: redis, port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ec-dev-redis
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {ec-store: redis}
  template:
    metadata:
      labels:
        ec-store: redis
        app.kubernetes.io/part-of: events-concierge
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          command: [sh, -ec]
          args:
            - 'exec redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy noeviction --requirepass "$REDIS_PASSWORD"'
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: ec-dev-redis, key: password}
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef: {name: ec-dev-redis, key: password}
          ports: [{containerPort: 6379}]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 192Mi}
          readinessProbe:
            exec: {command: [redis-cli, ping]}
          livenessProbe:
            exec: {command: [redis-cli, ping]}
