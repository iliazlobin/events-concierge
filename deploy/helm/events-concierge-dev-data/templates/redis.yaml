apiVersion: v1
kind: Service
metadata:
  name: ec-dev-redis
spec:
  type: ClusterIP
  selector: {ec-store: redis}
  ports: [{name: redis, port: 6379, targetPort: 6379}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ec-dev-redis
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storageClass }}
  resources:
    requests:
      storage: {{ .Values.redis.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ec-dev-redis
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {ec-store: redis}
  template:
    metadata:
      labels:
        ec-store: redis
        app.kubernetes.io/part-of: events-concierge
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          command: [sh, -ec]
          args:
            - 'exec redis-server --dir /data --save 300 1 --appendonly yes --appendfsync everysec --maxmemory 128mb --maxmemory-policy noeviction --requirepass "$REDIS_PASSWORD"'
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: ec-dev-redis, key: password}
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef: {name: ec-dev-redis, key: password}
          ports: [{containerPort: 6379}]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 384Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
          startupProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 150
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            timeoutSeconds: 5
          livenessProbe:
            exec: {command: [redis-cli, ping]}
            timeoutSeconds: 5
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: ec-dev-redis}
