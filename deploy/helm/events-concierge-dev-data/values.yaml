namespace: events-concierge-dev
storageClass: ec-dev-retain
# The shared platform owns its StorageClass. Set false with storageClass=shared-retain
# when landing on that cluster; the legacy ec-dev release keeps its existing class.
createStorageClass: true
zone: us-west1-a
postgres:
  applicationImage: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
  temporalImage: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
  size: 20Gi
  tls:
    enabled: false
    # Externally provisioned, versioned Secrets containing tls.crt, tls.key and ca.crt.
    # Rotate by changing the Secret name and rolling the Pod; keys are staged in memory.
    # Before activation, verify existing login roles have SCRAM password verifiers.
    applicationSecretName: ""
    temporalSecretName: ""
    # Empty names use each Service's <service>.<release namespace>.svc.cluster.local DNS name.
    applicationServerName: ""
    temporalServerName: ""
redis:
  size: 10Gi
  tls:
    enabled: false
    # Externally provisioned, versioned Secret containing tls.crt, tls.key and ca.crt.
    # Clients must verify hostname and CA; the localhost probe verifies CA and password.
    secretName: ""
    serverName: ""
  image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
